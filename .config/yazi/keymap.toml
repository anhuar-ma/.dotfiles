# Extra keybindings. These are prepended to Yazi's defaults instead of
# replacing them, so all standard bindings still work.

[mgr]
prepend_keymap = [
  # Navigation/bookmarks
  { on = ["g", "h"], run = "cd ~", desc = "Go home" },
  { on = ["g", "d"], run = "cd ~/Downloads", desc = "Go Downloads" },
  { on = ["g", "D"], run = "cd ~/Desktop", desc = "Go Desktop" },
  { on = ["g", "c"], run = "cd ~/.config", desc = "Go ~/.config" },
  { on = ["g", "w"], run = "cd ~/workplace", desc = "Go ~/workplace" },
  { on = ["g", "a"], run = "cd ~/.aki", desc = "Go ~/.aki" },

  # Fast visibility / layout switches
  { on = ".", run = "hidden toggle", desc = "Toggle hidden files" },
  { on = ["m", "s"], run = "linemode size", desc = "Line mode: size" },
  { on = ["m", "m"], run = "linemode mtime", desc = "Line mode: modified time" },
  { on = ["m", "p"], run = "linemode permissions", desc = "Line mode: permissions" },
  { on = ["m", "o"], run = "linemode owner", desc = "Line mode: owner" },
  { on = ["m", "n"], run = "linemode none", desc = "Line mode: none" },

  # macOS quality-of-life
  { on = ["o", "r"], run = "open --interactive", desc = "Open with..." },
  { on = ["o", "q"], run = "open --interactive", desc = "Open/Quick Look choices" },
  { on = ["R"], run = "shell -- open -R %h", desc = "Reveal hovered file in Finder" },
  { on = ["<Space>", "q"], run = "shell -- qlmanage -p %h >/dev/null 2>&1", desc = "Quick Look hovered file" },

  # Developer actions
  { on = ["c", "p"], run = "copy path --separator=unix", desc = "Copy path" },
  { on = ["c", "a"], run = "copy path --separator=unix --hovered", desc = "Copy hovered path" },
  { on = ["c", "f"], run = "copy filename", desc = "Copy filename" },
  { on = ["c", "d"], run = "copy dirname --separator=unix", desc = "Copy dirname" },
  { on = [";"], run = "shell --interactive", desc = "Run shell command" },
  { on = [":"], run = "shell --interactive --block", desc = "Run blocking shell command" },
  { on = ["!"], run = "shell '$SHELL' --block", desc = "Open shell here" },
  { on = ["z", "p"], run = "shell 'zip -r archive.zip %s' --block", desc = "Zip selected into archive.zip" },
  { on = ["z", "x"], run = "shell 'unar %s' --block", desc = "Extract selected with unar" },

  # Sorting shortcuts that are easy to remember.
  { on = [",", "n"], run = "sort natural --dir-first", desc = "Sort naturally" },
  { on = [",", "m"], run = "sort mtime --reverse --dir-first", desc = "Sort by modified time" },
  { on = [",", "s"], run = "sort size --reverse --dir-first", desc = "Sort by size" },
  { on = [",", "e"], run = "sort extension --dir-first", desc = "Sort by extension" },
]

[input]
prepend_keymap = [
  # Shell-like editing in prompts.
  { on = "<C-a>", run = "move -999", desc = "Go to line start" },
  { on = "<C-e>", run = "move 999", desc = "Go to line end" },
  { on = "<C-b>", run = "move -1", desc = "Move left" },
  { on = "<C-f>", run = "move 1", desc = "Move right" },
  { on = "<A-b>", run = "backward", desc = "Back one word" },
  { on = "<A-f>", run = "forward --end-of-word", desc = "Forward one word" },
  { on = "<C-u>", run = "kill bol", desc = "Kill to start" },
  { on = "<C-k>", run = "kill eol", desc = "Kill to end" },
]
