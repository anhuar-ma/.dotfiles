    # Row 5
    - '🔇'
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
    - {t: BASE, type: toggle}

    # Row 6
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
    - {t: BASE, type: toggle}
    - {t: '▽', type: trans}
    - {t: '▽', type: trans}
