
# =============================================================================
# ~/.tmux.conf  --  Productivity config for power users
#
# Targets tmux 3.2+   (uses display-popup, %hidden vars)
# Verify with        : tmux -V
# Reload after edit  : prefix + r   (or:  tmux source ~/.tmux.conf)
# Show every binding : prefix + ?
#
# Layout of this file
#   1.  Prefix
#   2.  Session creation
#   3.  Server / general behavior
#   4.  Activity / bell
#   5.  Windows / panes -- indexing
#   6.  Reload binding
#   7.  Splits + new windows
#   8.  Pane navigation + smart vim integration
#   9.  Pane resize / arrange
#   10. Window navigation
#   11. Sessions (tree, kill, fzf switcher)
#   12. Copy mode (vi)
#   13. Popups (floating shell, lazygit, help)
#   14. Theme palette (Catppuccin Mocha)
#   15. Status bar layout
#   16. Window list, borders, messages
#   17. Plugins (TPM)
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Prefix
# -----------------------------------------------------------------------------
# Keep tmux's default prefix (Ctrl+b). To change to e.g. Ctrl+a, replace both
# lines below with:
#     set -g prefix C-a
#     bind C-a send-prefix
set -g prefix C-b
bind C-b send-prefix


# -----------------------------------------------------------------------------
# 2. Session creation
# -----------------------------------------------------------------------------
# Family of "create" keys, mnemonic-paired:
#   prefix + c   -> new window  (lowercase = window)
#   prefix + C   -> new session, prompt for name
#   prefix + n   -> new session, instant (auto-numbered name)
#
# Note: `prefix + n` overrides tmux's default `next-window`.
# Next-window is still available via `prefix + Ctrl+l` (see section 10).
bind C-n new-session
bind C command-prompt -p "new session:" "new-session -s '%%'"


# -----------------------------------------------------------------------------
# 3. Server / general behavior
# -----------------------------------------------------------------------------
# Default $TERM inside tmux. tmux-256color is the modern choice and supports
# italics + true-color. If you ever see broken colors, fall back to "screen-256color".
set -g default-terminal "tmux-256color"

# Tell tmux which terminal capabilities to *add* (not replace).
#   :RGB     -> enable 24-bit truecolor for these $TERMs
#   :usstyle -> enable styled underlines (curly, double, etc.) for everything
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB,*:RGB"
set -ag terminal-features ",*:usstyle"

# How long tmux waits after pressing Esc before treating it as a standalone Esc.
# Default is 500ms which makes vim's Esc feel laggy. 10ms is snappy and safe.
set -sg escape-time 10

# Scrollback per pane. 100k lines ~= a few MB of RAM, totally fine.
# Lower it if you're memory constrained (e.g. set -g history-limit 10000).
set -g  history-limit 100000

# Forward focus events to the running program (so vim/nvim's FocusGained fires).
set -g  focus-events on

# Mouse: scroll, click panes/windows, drag to resize. Disable with `mouse off`.
set -g  mouse on

# OSC 52 system-clipboard integration. When you `y` in copy-mode, tmux emits
# an OSC 52 sequence that your terminal forwards to the OS clipboard.
# Works through SSH if your local terminal supports OSC 52 (Alacritty, iTerm,
# WezTerm, kitty, modern xterm all do).
set -g  set-clipboard on

# When you kill the last pane of a session, switch to another live session
# instead of disconnecting the client. Set to `on` to detach instead.
set -g  detach-on-destroy off

# How long status-line messages and `display-message` popups stay on screen (ms).
set -g  display-time 2000

# How often the status bar re-runs `#(...)` shell substitutions (seconds).
# Increasing this saves CPU; lowering this makes the bar (clock, branch) feel
# fresher. 5 is a good balance.
set -g  status-interval 5

# When two clients of different sizes view the same window, shrink to the
# smallest *visible* client (instead of always the smallest attached client).
setw -g aggressive-resize on


# -----------------------------------------------------------------------------
# 4. Activity / bell
# -----------------------------------------------------------------------------
# Highlight windows where activity occurs (status bar shows it via #F flags).
set -g monitor-activity on
# Don't pop a status-line message every time activity happens (just highlight).
set -g visual-activity off
set -g visual-bell off
# Suppress the actual terminal bell (no beep, no flash).
set -g bell-action none


# -----------------------------------------------------------------------------
# 5. Windows / panes -- indexing
# -----------------------------------------------------------------------------
# Start counting at 1 so window/pane numbers match keyboard digits.
set -g  base-index 1
setw -g pane-base-index 1
# When you close a window, renumber the rest so 1,2,3 stays contiguous.
set -g  renumber-windows on
# Auto-rename window to current command (e.g. "vim", "git").
setw -g automatic-rename on
# But do NOT let applications change the window name via escape sequences
# (some shells/editors are aggressive). Set to `on` if you want SSH/title changes.
set -g  allow-rename off


# -----------------------------------------------------------------------------
# 6. Reload binding
# -----------------------------------------------------------------------------
# `prefix + r` reloads this file and prints a confirmation in the status line.
bind r source-file ~/.tmux.conf \; display-message "  ~/.tmux.conf reloaded"


# -----------------------------------------------------------------------------
# 7. Splits + new windows
# -----------------------------------------------------------------------------
# Splits open in the *current pane's path* so you don't lose your place.
#   |  -> horizontal split (side by side)
#   -  -> vertical split (stacked)
# Backslash and underscore are alternates for keyboards where shift is awkward.
bind '|' split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '_' split-window -v -c "#{pane_current_path}"

# Free up the awkward defaults (`"` for vsplit, `%` for hsplit).
unbind '"'
unbind %

# New windows in current path (default opens in $HOME, less useful).
bind c new-window -c "#{pane_current_path}"


# -----------------------------------------------------------------------------
# 8. Pane navigation + smart vim integration
# -----------------------------------------------------------------------------
# Vim-style with prefix:
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Smart Alt+hjkl (no prefix) that "passes through" to vim/nvim if it's running
# in the active pane. This emulates the popular `vim-tmux-navigator` plugin
# without needing the plugin -- the regex below matches view/vim/nvim/etc.
# Inside vim, set up matching mappings for <M-h>, <M-j>, etc.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n M-h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"


# -----------------------------------------------------------------------------
# 9. Pane resize / arrange
# -----------------------------------------------------------------------------
# `-r` makes the binding repeatable: hold prefix once, then mash H/J/K/L.
# Numbers are columns (H/L) and rows (J/K). Tweak to taste.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind '=' select-layout -E         # equalize all panes in current layout
bind  m  resize-pane -Z           # zoom toggle (full-screen current pane)
bind  >  swap-pane -D             # swap with the next pane
bind  <  swap-pane -U             # swap with the previous pane

# How long pane-number overlay stays up (prefix + q). 4s is comfortable.
set -g display-panes-time 4000


# -----------------------------------------------------------------------------
# 10. Window navigation
# -----------------------------------------------------------------------------
# Repeatable prev/next with prefix + Ctrl+h / Ctrl+l. (We re-purposed prefix+n.)
bind -r C-h previous-window
bind -r C-l next-window

# `prefix + Tab` = jump to last window (toggle).
bind   Tab last-window

# Direct jump to window N with Alt+digit (no prefix). Alt+0 is window 10.
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10

# Reorder windows: prefix + N moves left, prefix + M moves right (repeatable).
bind -r N swap-window -t -1 \; previous-window
bind -r M swap-window -t +1 \; next-window


# -----------------------------------------------------------------------------
# 11. Sessions (tree, kill, fzf switcher)
# -----------------------------------------------------------------------------
# `prefix + S` -> session/window tree with previews. -Z opens it zoomed.
bind S choose-tree -Zs

# `prefix + X` -> kill current session, with a y/n confirmation prompt.
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# `Alt+s` (no prefix) -> jump to the last (alternate) session.
bind -n M-s switch-client -l

# `prefix + Ctrl+j` -> fzf popup to fuzzy-pick a session.
# Requires `fzf` in PATH. Excludes the current session from the list.
bind C-j display-popup -E -w 70% -h 60% \
  "tmux list-sessions -F '#S' \
   | grep -v \"^$(tmux display -p '#S')$\" \
   | fzf --reverse --header='switch session' --prompt='> ' \
   | xargs -r tmux switch-client -t"


# -----------------------------------------------------------------------------
# 12. Copy mode (vi)
# -----------------------------------------------------------------------------
# Use vi-style motions in copy mode and the command prompt.
setw -g mode-keys vi

# Enter copy mode with `prefix + v` (in addition to default `prefix + [`).
bind  v  copy-mode
# Paste the most recent buffer.
bind  ]  paste-buffer
# Browse all paste buffers visually.
bind  P  choose-buffer -Z

# Inside copy mode -- vim selection / yank semantics.
bind -T copy-mode-vi v       send-keys -X begin-selection
bind -T copy-mode-vi C-v     send-keys -X rectangle-toggle
bind -T copy-mode-vi y       send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y       send-keys -X copy-end-of-line
bind -T copy-mode-vi Escape  send-keys -X cancel
bind -T copy-mode-vi H       send-keys -X start-of-line
bind -T copy-mode-vi L       send-keys -X end-of-line
bind -T copy-mode-vi /       send-keys -X search-forward
bind -T copy-mode-vi ?       send-keys -X search-backward

# When you mouse-drag a selection in copy mode, *don't* exit copy mode at the
# end of the drag (default does). This matches vim's visual-mode feel.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear


# -----------------------------------------------------------------------------
# 13. Popups (floating shell, lazygit, help)  -- requires tmux 3.2+
# -----------------------------------------------------------------------------
# Floating shell in current pane's path. Great for quick `git status`, etc.
# Exit the popup with Ctrl+d or `exit`.
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "$SHELL"

# Floating lazygit (install via brew install lazygit).
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# Searchable list of every keybinding -- your built-in cheatsheet.
bind '?' list-keys -N


# =============================================================================
#                              THEME / STATUS BAR
# =============================================================================

# -----------------------------------------------------------------------------
# 14. Theme palette (Catppuccin Mocha)
# -----------------------------------------------------------------------------
# %hidden makes these vars usable in this file but invisible to users (3.2+).
# Swap any of these to retheme; the rest of the bar references them by name.
%hidden BG="#1e1e2e"      # base background
%hidden FG="#cdd6f4"      # main foreground
%hidden SEL="#313244"     # subtle separator / inactive borders
%hidden MUTED="#6c7086"   # secondary text
%hidden ACCENT="#89b4fa"  # primary accent (blue)
%hidden GREEN="#a6e3a1"   # git branch
%hidden YELLOW="#f9e2af"  # clock, prefix-armed indicator
%hidden PEACH="#fab387"   # current-window highlight
%hidden MAUVE="#cba6f7"   # hostname
%hidden RED="#f38ba8"     # activity warning


# -----------------------------------------------------------------------------
# 15. Status bar layout
# -----------------------------------------------------------------------------
set -g status               on
set -g status-position      bottom        # change to "top" if you prefer
set -g status-justify       left          # window list justification
set -g status-style         "bg=$BG,fg=$FG"
set -g status-left-length   80
set -g status-right-length  140

# ---- LEFT segment ------------------------------------------------------------
# Shows: [● session-name]   where ● turns into ⌨ on yellow when prefix is armed.
#   #{?client_prefix,A,B}  -> conditional: A if prefix is pressed, else B
#   #S                     -> session name
set -g status-left \
  "#[fg=$BG,bg=$ACCENT,bold] #{?client_prefix,#[bg=$YELLOW]⌨,●} #S #[fg=$ACCENT,bg=$BG]#{?client_prefix,#[fg=$YELLOW],} "

# ---- RIGHT segment -----------------------------------------------------------
# Shows: cwd | git-branch | user@host | HH:MM
#
# Each `#(...)` runs a shell command and is cached for `status-interval` (5s).
#   #(cd '#{pane_current_path}' && basename "$PWD")
#       -> last component of the active pane's working dir
#   #(... git branch --show-current ...)
#       -> empty when not in a git repo (silenced via 2>/dev/null)
#   #(ps -o user= -t #{pane_tty} | tail -n1 | tr -d ' ')
#       -> user of the active pane's *foreground process*. This means it
#          updates correctly when you run `su` or `sudo -i`. (The plain
#          built-in `#(whoami)` would show the user that *started* tmux.)
#   #h    -> hostname (built-in, free)
#   %H:%M -> 24h time (strftime, free)
#
# To hide a segment: delete its line and the separator just before/after.
# To add one: pick a color from section 14 and follow the pattern.
# set -g status-right \
#   "#[fg=$MUTED]#(cd '#{pane_current_path}' && basename \"$PWD\") \
# #[fg=$SEL]│ \
# #[fg=$GREEN]#(cd '#{pane_current_path}' && git branch --show-current 2>/dev/null) \
# #[fg=$SEL]│ \
# #[fg=$PEACH]#(ps -o user= -t #{pane_tty} | tail -n1 | tr -d ' ')#[fg=$MUTED]@#[fg=$MAUVE]#h \
# #[fg=$SEL]│ \
# #[fg=$YELLOW]%H:%M "

set -g status-right \
"#[fg=$GREEN]#(cd '#{pane_current_path}' && git branch --show-current 2>/dev/null) \
#[fg=$SEL]│ \
#[fg=$PEACH]#(ps -o user= -t #{pane_tty} | tail -n1 | tr -d ' ')#[fg=$MUTED]@#[fg=$MAUVE]#h \
#[fg=$SEL]│ \
#[fg=$YELLOW]%H:%M "


# -----------------------------------------------------------------------------
# 16. Window list, borders, messages
# -----------------------------------------------------------------------------
# Inactive windows: muted text. Suffix flags:
#   #{?window_zoomed_flag, ,}   -> show "" if pane is zoomed
#   #{?window_last_flag,~,}     -> show "~" if it's the last (alt) window
set -g window-status-format \
  "#[fg=$MUTED,bg=$BG] #I:#W#{?window_zoomed_flag, ,}#{?window_last_flag,~,} "

# Active window: peach background, bold.
set -g window-status-current-format \
  "#[fg=$BG,bg=$PEACH,bold] #I:#W#{?window_zoomed_flag, ,} "

# No spaces between window entries (the format strings already have padding).
set -g window-status-separator ""

# Activity flag style (when monitor-activity highlights a window).
set -g window-status-activity-style "fg=$RED,bg=$BG"

# Pane borders.
set -g pane-border-style          "fg=$SEL"
set -g pane-active-border-style   "fg=$ACCENT"

# Pane number overlay (prefix + q).
set -g display-panes-active-colour "$ACCENT"
set -g display-panes-colour        "$MUTED"

# Status line messages and the command prompt.
set -g message-style               "bg=$ACCENT,fg=$BG,bold"
set -g message-command-style       "bg=$ACCENT,fg=$BG,bold"

# Copy-mode / selection highlight color.
set -g mode-style                  "bg=$YELLOW,fg=$BG,bold"

# Big clock (prefix + t) color.
set -g clock-mode-colour           "$ACCENT"


# =============================================================================
# 17. Plugins -- TPM (Tmux Plugin Manager)
#
# One-time install:
#     git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#     tmux source ~/.tmux.conf
# In-tmux plugin commands:
#     prefix + I       -> install plugins listed below
#     prefix + U       -> update plugins
#     prefix + Alt+u   -> uninstall plugins removed from this list
#
# Adding a plugin: add a `set -g @plugin '...'` line, then prefix+I.
# Removing one:    delete the line, then prefix+Alt+u.
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'    # baseline of safe defaults
set -g @plugin 'tmux-plugins/tmux-yank'        # better OSC 52 + extra copy keys
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore session state
set -g @plugin 'tmux-plugins/tmux-continuum'   # resurrect on a timer
set -g @plugin 'sainnhe/tmux-fzf'              # prefix+F: fuzzy interface
set -g @plugin 'fcsonline/tmux-thumbs'         # prefix+space: hint-grab text
set -g @plugin 'wfxr/tmux-fzf-url'             # prefix+u: open URL via fzf

# Resurrect / continuum tuning ------------------------------------------------
# Restore vim/nvim sessions if the plugin's :mksession was used.
set -g @resurrect-strategy-vim   'session'
set -g @resurrect-strategy-nvim  'session'
# Save the visible content of each pane (so scrollback survives restart).
set -g @resurrect-capture-pane-contents 'on'
# Auto-restore on tmux server start.
set -g @continuum-restore        'on'
# Auto-save interval (minutes).
set -g @continuum-save-interval  '15'
# Remap save/restore keys to W/R (defaults conflict with Ctrl-s muscle memory).
set -g @resurrect-save    'W'    # prefix + W -> save now
set -g @resurrect-restore 'R'    # prefix + R -> restore last save

# tmux-thumbs --- vimium-style hints to grab text from the screen.
set -g @thumbs-key space
set -g @thumbs-command 'tmux set-buffer -- {} && tmux display-message "copied: {}"'

# Support terminal cursor shapes
set -ga terminal-features "*:usstyle"

# Ss sets the cursor shape. Se resets the cursor shape.
# 5 q is a blinking bar. (Use 6 q for a steady bar).
# set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[5 q'

# IMPORTANT: TPM init must be the LAST line in this file.
run '~/.tmux/plugins/tpm/tpm'



